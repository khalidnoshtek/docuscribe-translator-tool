<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuScribe | Translation Formatter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Dependencies -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
                <h1>DocuScribe</h1>
            </div>
            <p class="subtitle">Translation Formatting & Checking Tool</p>
        </header>

        <main>
            <div class="editor-section">
                <div class="toolbar">
                    <button id="btn-ai-generate" class="btn primary" title="AI Transform to Official Document">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                        AI Generate Official Document
                    </button>
                </div>
                <textarea id="text-input" placeholder="Paste the rough translation here (Arabic/Urdu to English translation)..."></textarea>
                <div class="stats">
                    <span id="word-count">0 words</span>
                    <span id="doc-status">Ready to generate</span>
                </div>
            </div>

            <div class="sidebar">
                <div class="card" id="preview-card">
                    <h3>Document Preview</h3>
                    <div id="preview-content" class="preview-area">
                        <div class="empty-state">
                            <p>Paste text and click generate to see a professional preview.</p>
                        </div>
                    </div>
                    <div id="download-actions" class="hidden" style="padding: 1rem; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.5rem;">
                        <button id="btn-download-word" class="btn primary" style="width: 100%; justify-content: center;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Download Word (.docx)
                        </button>
                        <button id="btn-download-pdf" class="btn outline" style="width: 100%; justify-content: center;">
                            Download PDF
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="loader" class="loader-overlay hidden">
        <div class="spinner"></div>
        <p>Analyzing text...</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
