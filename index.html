<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuScribe | Translation Formatter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Dependencies -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
                <h1>DocuScribe</h1>
            </div>
            <p class="subtitle">Translation Formatting & Checking Tool</p>
        </header>

        <main>
            <div class="editor-section">
                <div class="toolbar">
                    <button id="btn-clean" class="btn primary" title="Clean extra spaces and fix basic formatting">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 15h18v4H3z"></path><path d="M3 9v6"></path><path d="M21 15v6H5a2 2 0 0 1 0-4h14v4"></path></svg>
                        Clean Formatting
                    </button>
                    <button id="btn-grammar" class="btn secondary" title="Check grammar and spelling">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-9 5 18 3-9h5"></path></svg>
                        Check Grammar
                    </button>
                    
                    <div class="spacer"></div>
                    
                    <button id="btn-word" class="btn outline" title="Export to Word format (.docx)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        Word (.docx)
                    </button>
                    <button id="btn-pdf" class="btn outline" title="Export to PDF format">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        PDF
                    </button>
                </div>
                <textarea id="text-input" placeholder="Paste the translated English text here..."></textarea>
                <div class="stats">
                    <span id="word-count">0 words</span>
                    <span id="char-count">0 characters</span>
                </div>
            </div>

            <div class="sidebar">
                <div class="card">
                    <h3>Grammar & Spelling Suggestions</h3>
                    <div id="suggestions-container" class="suggestions-list">
                        <div class="empty-state">
                            <p>Click "Check Grammar" to analyze the text.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="loader" class="loader-overlay hidden">
        <div class="spinner"></div>
        <p>Analyzing text...</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
