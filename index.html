<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuScribe | Text to Official Doc</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
                <h1>Text to Official Doc</h1>
            </div>
            <p class="subtitle">AI-Powered Professional Document Drafting</p>
        </header>

        <main style="grid-template-columns: 1fr;">
            <div class="editor-section" style="max-width: 1000px; margin: 0 auto; width: 100%;">
                <div class="toolbar">
                    <button id="btn-ai-generate" class="btn primary" style="padding: 0.75rem 2rem; font-size: 1.1rem;" title="AI Transform and Download Word">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                        Generate & Download Official Word Document
                    </button>
                </div>
                <textarea id="text-input" placeholder="Paste the rough translation here (Arabic/Urdu to English translation)..."></textarea>
                
                <div id="download-section" class="hidden" style="margin-top: 1rem; padding: 1rem; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: var(--radius-md); display: flex; align-items: center; gap: 1rem;">
                    <span style="font-weight: 500; color: #4ade80;">✓ Document Ready:</span>
                    <button id="btn-download-word" class="btn primary" style="font-size: 0.9rem;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download Word (.docx)
                    </button>
                    <button id="btn-download-pdf" class="btn outline" style="font-size: 0.9rem;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        Download PDF
                    </button>
                </div>

                <div class="stats">
                    <span id="word-count">0 words</span>
                    <span id="doc-status">Ready to generate</span>
                </div>
            </div>
        </main>
    </div>
    
    <div id="loader" class="loader-overlay hidden">
        <div class="spinner"></div>
        <p>Analyzing text...</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
